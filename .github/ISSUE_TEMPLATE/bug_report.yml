name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order. Replace private paths with placeholders.
      placeholder: |
        1. Start flashback-sampler with the default loopback source.
        2. Play audio for 30 seconds.
        3. Drag the last 10 seconds into Ableton Live.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the full error or console output.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release tag
      description: For example v0.4.2, or a commit if you built from source.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Settings > System > About, for example "Windows 11 24H2 (26100)".
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Audio device
      description: The capture source and the output device.
    validations:
      required: true
  - type: input
    id: rate
    attributes:
      label: Sample rate
      description: The device format in Windows sound settings, for example 48000 Hz.
    validations:
      required: true
  - type: checkboxes
    id: ai
    attributes:
      label: AI use
      options:
        - label: I said in the text whether I used an AI tool to write this (see AI_POLICY.md).
          required: true
