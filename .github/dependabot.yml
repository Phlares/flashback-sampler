version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
  # uv.lock holds every Python pin with hashes. lockfile-only: Dependabot
  # moves uv.lock, not the ranges in pyproject.toml.
  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-major:
        patterns: ["*"]
        update-types: ["major"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: pre-commit
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      hooks:
        patterns: ["*"]
