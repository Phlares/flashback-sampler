version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # requirements*.in compile to hash-locked requirements*.txt (uv pip
  # compile). lockfile-only: Dependabot moves the locks, not the .in files
  # or pyproject.toml.
  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pre-commit
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      hooks:
        patterns: ["*"]
