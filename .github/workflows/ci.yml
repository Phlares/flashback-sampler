name: CI

# From the Phlares/workflows copier template (product tier). Change the
# structure with `copier update`; Dependabot moves the pins. No path filter:
# a required check that skips never reports and blocks the PR.
# Repo-specific: test-py builds the Zig DLL first, and the zig job runs the
# engine tests. release.yml is not from the template.
on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: Phlares/workflows/.github/workflows/check.yml@b980c7e820f2a22b596c63f4b00f412f42e5369a # v1.9.0
    with:
      name: lint
      python-version: "3.12"
      # The zig-fmt hook needs zig on the runner.
      zig-version: 0.16.0
      uv-version: 0.13.1
      prek-cache: true
      timeout-minutes: 5
      install: uv sync --locked --only-group lint
      run: uv run --no-sync prek run --all-files --hook-stage manual --show-diff-on-failure

  test-py:
    uses: Phlares/workflows/.github/workflows/check.yml@b980c7e820f2a22b596c63f4b00f412f42e5369a # v1.9.0
    with:
      name: pytest
      runs-on: windows-latest
      python-version: "3.12"
      zig-version: 0.16.0
      uv-version: 0.13.1
      timeout-minutes: 6
      # tests/conftest.py exits the session when the native library is
      # missing. FLASHBACK_REQUIRE_NATIVE is kept so a revert of that gate
      # does not silently lose the CI check.
      env: |
        QT_QPA_PLATFORM=offscreen
        PYTHONUTF8=1
        FLASHBACK_REQUIRE_NATIVE=1
      install: uv sync --locked --extra dev
      run: |
        (cd core && zig build -Doptimize=ReleaseSafe)
        uv run --no-sync pytest tests/unit -m "not audio_hw and not perf"

  typecheck:
    uses: Phlares/workflows/.github/workflows/check.yml@b980c7e820f2a22b596c63f4b00f412f42e5369a # v1.9.0
    with:
      name: typecheck
      python-version: "3.12"
      uv-version: 0.13.1
      timeout-minutes: 5
      # The dev extra gives pyright the test imports.
      install: uv sync --locked --group typecheck --extra dev
      run: uv run --no-sync pyright

  zig:
    uses: Phlares/workflows/.github/workflows/check.yml@b980c7e820f2a22b596c63f4b00f412f42e5369a # v1.9.0
    with:
      name: zig
      zig-version: 0.16.0
      working-directory: core
      timeout-minutes: 3
      # zig fmt runs in the lint job.
      run: zig build test

  # Runtime dependencies only: what the project ships.
  licenses:
    uses: Phlares/workflows/.github/workflows/check.yml@b980c7e820f2a22b596c63f4b00f412f42e5369a # v1.9.0
    with:
      name: licenses
      python-version: "3.12"
      uv-version: 0.13.1
      timeout-minutes: 5
      install: uv sync --locked --no-dev
      run: uv run --no-sync python .wf/.github/scripts/licenses.py
