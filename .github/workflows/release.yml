name: release

# Manual only while releases are paused: a Windows build bills ~15-20
# minutes per run. Re-add the `push: tags: ["v*.*.*"]` trigger when
# releases resume.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Leave blank to build current HEAD without publishing."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build standalone (windows)
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    outputs:
      version: ${{ steps.resolve.outputs.version }}
      archive: ${{ steps.package.outputs.archive }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package + dev + pyinstaller
        run: |
          pip install -e ".[dev]"
          pip install pyinstaller>=6.0

      - name: Resolve version
        id: resolve
        shell: pwsh
        run: |
          $ref = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrEmpty($ref)) { $ref = "${{ github.ref_name }}" }
          $version = $ref -replace '^v', ''
          if ([string]::IsNullOrEmpty($version) -or $version -eq "${{ github.ref_name }}") {
            $version = (python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          }
          echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          echo "Resolved version: $version"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build native core (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe
        working-directory: core

      - name: Run unit tests (smoke before build)
        run: pytest tests/unit -m "not audio_hw and not perf" -x -q

      - name: Build with PyInstaller
        run: pyinstaller flashback_sampler.spec --noconfirm --clean

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/flashback-sampler/flashback-sampler.exe")) {
            Write-Error "Expected dist/flashback-sampler/flashback-sampler.exe was not produced"
            exit 1
          }
          Get-ChildItem dist/flashback-sampler -Recurse | Measure-Object -Property Length -Sum |
            ForEach-Object { "Bundle size: {0:N1} MB" -f ($_.Sum / 1MB) }

      - name: Package archive
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.resolve.outputs.version }}"
          $name = "flashback-sampler-$version-windows-x64.zip"
          Compress-Archive -Path dist/flashback-sampler/* -DestinationPath $name -CompressionLevel Optimal
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -FilePath "$name.sha256" -Encoding ascii
          echo "archive=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          echo "Built $name (sha256: $hash)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashback-sampler-windows-x64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  publish:
    name: publish github release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: flashback-sampler-windows-x64
          path: ./release-assets

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          version="${{ needs.build.outputs.version }}"
          previous_tag=$(git describe --tags --abbrev=0 "v${version}^" 2>/dev/null || echo "")
          if [ -z "$previous_tag" ]; then
            range="HEAD"
            echo "First tagged release; using full history."
          else
            range="${previous_tag}..HEAD"
            echo "Diff range: $range"
          fi
          {
            echo "## Changes"
            git log --pretty=format:'- %s (%h)' $range
            echo ""
            echo ""
            echo "## Install"
            echo ""
            echo "Download \`${{ needs.build.outputs.archive }}\`, unzip, and run \`flashback-sampler.exe\`."
            echo ""
            echo "Verify with the bundled \`.sha256\` if you want."
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/*
          fail_on_unmatched_files: true
