name: test

# Minutes budget: private-repo Actions minutes are scarce. Every job bills
# rounded up to a whole minute; Windows costs 2x, macOS 10x. So:
#   - one Windows pytest job (py3.12, the version release.yml ships)
#   - Zig unit tests on ubuntu (1x); the Windows job builds the DLL anyway
#   - run only when main moves (feature PRs target dev, tests run locally)
#   - hard timeouts, so a hung test costs minutes, not hours
# Expected cost per run: ~5 billed minutes. Worst case (both hang): 15.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (windows / py3.12)
    runs-on: windows-latest
    timeout-minutes: 6

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      # A missing/broken native build must turn CI red, not quietly skip
      # the parity harness's native half (see tests/conftest.py). Unset
      # for local dev runs, which stay green on Zig-less workstations.
      FLASHBACK_REQUIRE_NATIVE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install package + dev extras
        run: pip install -e ".[dev]"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build native core (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe
        working-directory: core

      - name: Run unit tests
        run: pytest tests/unit -m "not audio_hw and not perf"

  zig:
    name: zig (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Format check
        run: zig fmt --check build.zig src
      - name: Unit tests (Debug — full safety checks)
        run: zig build test
