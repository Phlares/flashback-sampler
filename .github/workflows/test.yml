name: test

# Two jobs: pytest on Windows (py3.12, the version release.yml ships;
# it builds the DLL anyway) and the Zig unit tests on Ubuntu. Hard
# timeouts so a hung test stops in minutes. Every pull request runs
# both jobs: `main` and `dev` require them, and a skipped check blocks
# the merge. Docs-only pushes skip it; nothing requires a check there.
on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (windows / py3.12)
    runs-on: windows-latest
    timeout-minutes: 6

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      # tests/conftest.py exits the session when the native library is
      # missing. This variable is kept so a revert of that gate does not
      # silently lose the CI check.
      FLASHBACK_REQUIRE_NATIVE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install package + dev extras
        run: pip install -e ".[dev]"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build native core (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe
        working-directory: core

      - name: Run unit tests
        run: pytest tests/unit -m "not audio_hw and not perf"

  zig:
    name: zig (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Format check
        run: zig fmt --check build.zig src
      - name: Unit tests (Debug — full safety checks)
        run: zig build test
