name: test

# Four jobs, all run through Phlares/workflows check.yml: pytest on
# Windows (py3.12, the version release.yml ships; it builds the DLL
# anyway), the Zig unit tests on Ubuntu, `lint`, which runs the hooks
# in .pre-commit-config.yaml (ruff and zig fmt) on every file, and
# `typecheck`, which runs pyright on Ubuntu. Hard timeouts so a hung test
# stops in minutes. Every pull request runs all four jobs. `main` and
# `dev` require all four checks (lint, pytest, typecheck, zig), and a
# skipped check blocks the merge. Docs-only pushes skip the workflow;
# nothing requires a check there.
on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    uses: Phlares/workflows/.github/workflows/check.yml@9eebfcd611eaf14c740b760b0e14e8bf404426f4 # v1.7.0
    with:
      name: pytest
      runs-on: windows-latest
      python-version: "3.12"
      zig-version: 0.16.0
      timeout-minutes: 6
      # tests/conftest.py exits the session when the native library is
      # missing. FLASHBACK_REQUIRE_NATIVE is kept so a revert of that gate
      # does not silently lose the CI check.
      env: |
        QT_QPA_PLATFORM=offscreen
        PYTHONUTF8=1
        FLASHBACK_REQUIRE_NATIVE=1
      install: pip install -e ".[dev]"
      run: |
        (cd core && zig build -Doptimize=ReleaseSafe)
        pytest tests/unit -m "not audio_hw and not perf"

  zig:
    uses: Phlares/workflows/.github/workflows/check.yml@9eebfcd611eaf14c740b760b0e14e8bf404426f4 # v1.7.0
    with:
      name: zig
      zig-version: 0.16.0
      working-directory: core
      timeout-minutes: 3
      # zig fmt runs in the lint job.
      run: zig build test

  lint:
    uses: Phlares/workflows/.github/workflows/check.yml@9eebfcd611eaf14c740b760b0e14e8bf404426f4 # v1.7.0
    with:
      name: lint
      python-version: "3.12"
      zig-version: 0.16.0
      uv-version: 0.13.1
      timeout-minutes: 5
      # Hook versions live in .pre-commit-config.yaml. prek is pinned by hash
      # in uv.lock (group lint); Dependabot moves it.
      install: uv sync --locked --only-group lint
      run: uv run --no-sync prek run --all-files --show-diff-on-failure

  typecheck:
    uses: Phlares/workflows/.github/workflows/check.yml@9eebfcd611eaf14c740b760b0e14e8bf404426f4 # v1.7.0
    with:
      name: typecheck
      python-version: "3.12"
      uv-version: 0.13.1
      timeout-minutes: 5
      # pyright is pinned by hash in uv.lock (group typecheck); Dependabot
      # moves it. The dev extra gives pyright the test imports.
      install: uv sync --locked --group typecheck --extra dev
      run: uv run --no-sync pyright
