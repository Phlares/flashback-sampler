name: test

# Three jobs, all run through Phlares/workflows check.yml: pytest on
# Windows (py3.12, the version release.yml ships; it builds the DLL
# anyway), the Zig unit tests on Ubuntu, and `lint`, which runs the hooks
# in .pre-commit-config.yaml (ruff and zig fmt) on every file. Hard
# timeouts so a hung test stops in minutes. Every pull request runs all
# three jobs: `main` and `dev` require them, and a skipped check blocks
# the merge. Docs-only pushes skip it; nothing requires a check there.
on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    uses: Phlares/workflows/.github/workflows/check.yml@ef4ee4741aa6ee0017a6446b55356e50bf635c49 # v1.0.0
    with:
      name: pytest
      runs-on: windows-latest
      python-version: "3.12"
      zig-version: 0.16.0
      timeout-minutes: 6
      # tests/conftest.py exits the session when the native library is
      # missing. FLASHBACK_REQUIRE_NATIVE is kept so a revert of that gate
      # does not silently lose the CI check.
      env: |
        QT_QPA_PLATFORM=offscreen
        PYTHONUTF8=1
        FLASHBACK_REQUIRE_NATIVE=1
      install: pip install -e ".[dev]"
      run: |
        (cd core && zig build -Doptimize=ReleaseSafe)
        pytest tests/unit -m "not audio_hw and not perf"

  zig:
    uses: Phlares/workflows/.github/workflows/check.yml@ef4ee4741aa6ee0017a6446b55356e50bf635c49 # v1.0.0
    with:
      name: zig
      zig-version: 0.16.0
      working-directory: core
      timeout-minutes: 3
      # zig fmt runs in the lint job.
      run: zig build test

  lint:
    uses: Phlares/workflows/.github/workflows/check.yml@ef4ee4741aa6ee0017a6446b55356e50bf635c49 # v1.0.0
    with:
      name: lint
      zig-version: 0.16.0
      timeout-minutes: 5
      # Hook versions live in .pre-commit-config.yaml and Dependabot moves
      # them. The prek version below is a manual bump: Dependabot does not
      # read it.
      run: pipx run --spec prek==0.5.5 prek run --all-files --show-diff-on-failure
