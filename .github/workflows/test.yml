name: test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (windows / py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package + dev extras
        run: pip install -e ".[dev]"

      - name: Run unit tests with coverage
        run: >
          pytest tests/unit
          --cov=flashback_sampler
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov
          --junitxml=junit.xml
          -m "not audio_hw and not perf"

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

      - name: Upload coverage HTML
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov
          if-no-files-found: warn

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-py${{ matrix.python-version }}
          path: junit.xml
          if-no-files-found: warn

  zig:
    name: zig (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Format check
        run: zig fmt --check build.zig src
      - name: Unit tests (Debug — full safety checks)
        run: zig build test
      - name: Build shared library (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe
      - name: Cross-compile health check
        if: matrix.os == 'ubuntu-latest'
        run: |
          zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-windows
          zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-macos
          zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-gnu
