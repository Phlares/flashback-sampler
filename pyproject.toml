[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashback-sampler"
version = "0.3.0"
description = "Circular audio buffer that retains the past several minutes of audio for sampling, playback, and export."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Phlares" }]
dependencies = [
    "numpy>=1.24",
    "PySide6>=6.7",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
]
release = [
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
include = ["flashback_sampler*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"flashback_sampler.core" = ["alc_template.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "audio_hw: requires real audio hardware (opt-in, not run in CI)",
    "slow: takes more than a second",
    "perf: timing-sensitive performance regression test (excluded on CI runners; run locally to catch regressions)",
]
timeout = 30
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["flashback_sampler"]
omit = [
    "flashback_sampler/app/main.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
# fail_under intentionally unset. Coverage today is ~53% post-omits; the
# UI widget layer (waveform_view, rotary_knob, slot_chip, etc.) is the
# largest remaining gap and needs Qt-fixture tests to close. Re-enable
# this once you've ratcheted real coverage upward — set the floor a few
# points below the current actual so the CI tripwire catches regressions
# without forcing you to write tests on every commit.
exclude_also = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
