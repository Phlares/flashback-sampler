[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashback-sampler"
version = "0.0.1"
description = "Circular audio buffer that retains the past several minutes of audio for sampling, playback, and export."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Phlares" }]
dependencies = [
    "numpy>=1.24",
    "sounddevice>=0.5.0",
    "soundfile>=0.12.1",
    "soundcard>=0.4.3 ; sys_platform == 'win32'",
    "PySide6>=6.7",
]

[project.optional-dependencies]
pi = ["RPi.GPIO"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
]

[tool.setuptools.packages.find]
include = ["flashback_sampler*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "audio_hw: requires real audio hardware (opt-in, not run in CI)",
    "slow: takes more than a second",
]
timeout = 30
filterwarnings = [
    "ignore::DeprecationWarning",
]
